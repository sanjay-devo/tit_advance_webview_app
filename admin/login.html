<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#F9FAFC">
  <link rel="icon" href="https://indiacybercafe.com/wp-content/uploads/2026/10/TIT-Advance-App-icon.png" type="image/png">
  <meta name="description" content="Sign in to the TIT Advance course administration panel.">
  <title>Admin sign in | TIT Advance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:light;--bg:#F9FAFC;--surface:#fff;--ink:#171B2B;--secondary:#626B7D;--border:#E4E5EA;--blue:#3767D8;--danger:#D92F32;--shadow:0 12px 32px rgb(36 48 68 / 8%);font-family:Poppins,Arial,sans-serif}
    *{box-sizing:border-box}body{display:grid;min-width:320px;min-height:100vh;margin:0;padding:24px;place-items:center;background:radial-gradient(ellipse at 10% 15%,rgb(246 160 74 / 10%),transparent 36%),var(--bg);color:var(--ink);line-height:1.55}
    .login-shell{width:min(100%,520px)}.login-card{padding:clamp(24px,7vw,40px);border:1px solid var(--border);border-radius:30px;background:var(--surface);box-shadow:var(--shadow)}
    .brand{margin:0 0 26px;text-align:center;font-size:.9rem;font-weight:600}
    .button{display:flex;width:100%;min-height:52px;align-items:center;justify-content:center;gap:12px;margin-top:2px;padding:11px 18px;border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit;font-size:.9rem;font-weight:600;cursor:pointer}
    .button:hover:not(:disabled){background:#F4F6FA;border-color:#C9CDD6}.button:focus-visible{outline:3px solid rgb(55 103 216 / 35%);outline-offset:3px}.button:disabled{cursor:progress;opacity:.65}
    .google-mark{width:20px;height:20px;flex:0 0 auto}.button-label[data-loading=true]::before{display:inline-block;width:14px;height:14px;margin-right:9px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;content:"";vertical-align:-2px;animation:spin .7s linear infinite}
    .status{min-height:0;margin:14px 0 0;color:var(--secondary);font-size:.86rem}.status:empty{display:none}.status[data-kind=error]{padding:12px 14px;border-inline-start:3px solid var(--danger);border-radius:10px;background:#FFF5F4;color:#8D2426}.status[data-kind=loading]::before{display:inline-block;width:14px;height:14px;margin-right:9px;border:2px solid #C9D2E3;border-top-color:var(--blue);border-radius:50%;content:"";vertical-align:-2px;animation:spin .7s linear infinite}
    .footer{margin:20px 0 0;color:var(--secondary);font-size:.8rem}.footer a{color:#2857BF;text-underline-offset:3px}.footer a:focus-visible{outline:3px solid rgb(55 103 216 / 35%);outline-offset:3px}
    @keyframes spin{to{transform:rotate(360deg)}}@media(max-width:480px){body{padding:14px}.login-card{border-radius:24px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <main class="login-shell">
    <section class="login-card" aria-labelledby="page-title">
      <p class="brand" id="page-title">TIT Advance</p>
      <button class="button" id="sign-in-button" type="button">
        <svg class="google-mark" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5Z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.92c-.58 2.96-2.26 5.48-4.76 7.18l7.73 6C44.4 38.05 46.98 31.8 46.98 24.55Z"/>
          <path fill="#FBBC05" d="M10.53 28.59A14.4 14.4 0 0 1 9.75 24c0-1.59.27-3.13.76-4.59l-7.98-6.19A23.9 23.9 0 0 0 0 24c0 3.87.93 7.53 2.56 10.78l7.97-6.19Z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.9-5.8l-7.73-6c-2.14 1.45-4.89 2.3-8.17 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48Z"/>
        </svg>
        <span class="button-label" id="button-label">Continue with Google</span>
      </button>
      <p class="status" id="status" role="status" aria-live="polite"></p>
      <p class="footer"><a href="../index.html">Return to student app</a></p>
    </section>
  </main>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
    import {
      browserLocalPersistence,
      getAuth,
      GoogleAuthProvider,
      onAuthStateChanged,
      setPersistence,
      signInWithPopup,
      signOut
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAXMh2e_ZNW7Ivx200JqYs4MLTBwyOi9yA",
      authDomain: "tit-groups.firebaseapp.com",
      databaseURL: "https://tit-groups-default-rtdb.firebaseio.com",
      projectId: "tit-groups",
      storageBucket: "tit-groups.firebasestorage.app",
      messagingSenderId: "658719825802",
      appId: "1:658719825802:web:2bd8b465073617db1bf273"
    };
    const SESSION_KEY = "titAdvanceAdminSession";
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const authReady = setPersistence(auth, browserLocalPersistence);
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: "select_account" });
    const button = document.getElementById("sign-in-button");
    const buttonLabel = document.getElementById("button-label");
    const status = document.getElementById("status");
    let busy = false;
    if (new URLSearchParams(window.location.search).get("access") === "denied") {
      status.dataset.kind = "error";
      status.textContent = "Admin access was not verified. Your Firebase user profile must have role set to admin.";
    }

    function setBusy(value, message = "Continue with Google") {
      busy = value;
      button.disabled = value;
      button.setAttribute("aria-busy", String(value));
      buttonLabel.textContent = message;
      buttonLabel.dataset.loading = String(value);
    }

    async function verifyAdminAndContinue(user) {
      setBusy(true, "Checking admin access…");
      const idToken = await user.getIdToken();
      const response = await fetch(`${firebaseConfig.databaseURL}/users/${encodeURIComponent(user.uid)}.json?auth=${encodeURIComponent(idToken)}`, {
        headers: { Accept: "application/json", "X-Firebase-ETag": "true" }
      });
      let profile = await response.json();
      if (!response.ok) {
        const detail = profile && profile.error;
        throw new Error(typeof detail === "string" ? detail : `Could not verify your Firebase user profile (HTTP ${response.status}).`);
      }
      let registered = false;
      if (profile === null) {
        const etag = response.headers.get("ETag");
        if (!etag) {
          throw new Error("Firebase did not provide an ETag; account registration was cancelled to avoid overwriting existing data.");
        }
        const createResponse = await fetch(`${firebaseConfig.databaseURL}/users/${encodeURIComponent(user.uid)}.json?auth=${encodeURIComponent(idToken)}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json", "If-Match": etag },
          body: JSON.stringify({
            role: "user",
            email: user.email || null,
            displayName: user.displayName || null,
            createdAt: Date.now()
          })
        });
        const createdProfile = await createResponse.json();
        if (createResponse.status === 412) {
          const latestResponse = await fetch(`${firebaseConfig.databaseURL}/users/${encodeURIComponent(user.uid)}.json?auth=${encodeURIComponent(idToken)}`, {
            headers: { Accept: "application/json" }
          });
          profile = await latestResponse.json();
          if (!latestResponse.ok) {
            const detail = profile && profile.error;
            throw new Error(typeof detail === "string" ? detail : `Could not verify your Firebase user profile (HTTP ${latestResponse.status}).`);
          }
        } else if (!createResponse.ok) {
          const detail = createdProfile && createdProfile.error;
          throw new Error(typeof detail === "string" ? detail : `Could not register your Firebase user profile (HTTP ${createResponse.status}).`);
        } else {
          profile = createdProfile;
          registered = true;
        }
      }
      if (!profile || profile.role !== "admin") {
        await signOut(auth);
        localStorage.removeItem(SESSION_KEY);
        status.dataset.kind = "error";
        status.textContent = registered
          ? "Your account has been registered, but it does not have admin access. Ask an administrator to grant access."
          : "This Google account does not have admin access. Ask an administrator to set users/{your Firebase UID}/role to admin.";
        setBusy(false);
        return;
      }
      const session = {
        idToken,
        refreshToken: user.refreshToken,
        tokenExpiry: Date.now() + 55 * 60 * 1000,
        uid: user.uid,
        email: user.email || ""
      };
      localStorage.setItem(SESSION_KEY, JSON.stringify(session));
      window.location.replace("./index.html");
    }

    button.addEventListener("click", async () => {
      if (busy) return;
      status.removeAttribute("data-kind");
      status.textContent = "";
      setBusy(true, "Connecting to Google…");
      try {
        await authReady;
        const credential = await signInWithPopup(auth, provider);
        await verifyAdminAndContinue(credential.user);
      } catch (error) {
        console.error("Firebase Google admin sign-in failed.", error);
        status.dataset.kind = "error";
        if (error.code === "auth/unauthorized-domain") {
          status.textContent = "This website domain is not enabled for Firebase Authentication. Add it under Firebase Console → Authentication → Settings → Authorized domains.";
        } else if (error.code === "auth/popup-blocked") {
          status.textContent = "The sign-in popup was blocked. Allow popups for this site and try again.";
        } else if (error.code === "auth/popup-closed-by-user" || error.code === "auth/cancelled-popup-request") {
          status.textContent = "Sign-in was cancelled. You can try again.";
        } else if (error.code === "PERMISSION_DENIED" || error.code === "permission_denied") {
          status.textContent = "Firebase rules did not allow verification of your user profile. Allow signed-in users to read only their own users/{uid} record.";
        } else {
          status.textContent = error.message || "Sign-in failed. Check Firebase Authentication and try again.";
        }
        setBusy(false);
      }
    });

    try {
      const logout = new URLSearchParams(window.location.search).get("logout") === "1";
      if (logout) {
        localStorage.removeItem(SESSION_KEY);
        await authReady;
        await signOut(auth);
        window.history.replaceState(null, "", window.location.pathname);
      }
      const existingSession = JSON.parse(localStorage.getItem(SESSION_KEY) || "null");
      if (!logout && existingSession && existingSession.uid) {
        await authReady;
        onAuthStateChanged(auth, (user) => {
          if (user && user.uid === existingSession.uid) {
            verifyAdminAndContinue(user).catch((error) => {
              console.error("Unable to recheck admin role.", error);
              localStorage.removeItem(SESSION_KEY);
              status.dataset.kind = "error";
              status.textContent = error.message || "Unable to verify admin access.";
              setBusy(false);
            });
          } else {
            localStorage.removeItem(SESSION_KEY);
          }
        });
      }
    } catch (error) {
      console.error("Firebase Authentication could not be initialized.", error);
      status.dataset.kind = "error";
      status.textContent = error.message || "Firebase Authentication could not be initialized.";
    }
  </script>
</body>
</html>
