<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Student Learning Portal - Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            poppins: ['Poppins', 'sans-serif'],
          },
          colors: {
            app: {
              bg: '#F9FAFC',
              surface: '#FFFFFF',
              surfaceWarm: '#FEFBF6',
              primary: '#171B2B',
              secondary: '#626B7D',
              muted: '#A5A7AA',
              border: '#E4E5EA',
              orange: '#F6A04A',
              orangeLight: '#FFE2C4',
              blue: '#3767D8',
              teal: '#64C5CC',
            },
            card: {
              blue: '#BDD3FC',
              blueDeco: '#B1C7F6',
              blueAccent: '#83A9E8',
              indigo: '#5F6FE0',
              indigoDeco: '#7173C6',
              indigoAccent: '#F0A45B',
              mint: '#C4EBF0',
              mintDeco: '#B3E2E8',
              mintAccent: '#64C5CC',
              sky: '#CEE7FD',
              skyDeco: '#BBDFF4',
              skyAccent: '#78B4D8',
            }
          },
          boxShadow: {
            soft: '0 12px 32px rgba(36, 48, 68, 0.08)',
            hero: '0 16px 36px rgba(36, 48, 68, 0.06)',
            floating: '0 14px 34px rgba(36, 48, 68, 0.12)',
            card: '0 8px 24px rgba(36, 48, 68, 0.04)',
          },
          borderRadius: {
            'hero': '48px',
            'card': '30px',
            'pill': '999px',
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #F9FAFC;
      color: #171B2B;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .hero-gradient {
      background: linear-gradient(145deg, #E9DDF0 0%, #FFF0D8 38%, #F8D8C6 72%, #DDF1E7 100%);
    }
    .safe-top {
      padding-top: env(safe-area-inset-top, 16px);
    }
    .safe-bottom {
      padding-bottom: env(safe-area-inset-bottom, 24px);
    }
    .screen[hidden] {
      display: none;
    }
    .course-screen {
      width: 100%;
      min-height: 100vh;
      color: #171B2B;
      background: #F9FAFC;
      user-select: none;
    }
    .course-header {
      position: relative;
      display: flex;
      min-height: 154px;
      align-items: center;
      justify-content: center;
      padding: calc(env(safe-area-inset-top, 0px) + 20px) 20px 40px;
      overflow: hidden;
      border-radius: 0 0 48px 48px;
      background: linear-gradient(110deg, #E9DDF0 0%, #FFF0D8 52%, #F8D8C6 100%);
      box-shadow: 0 16px 36px rgba(36, 48, 68, 0.06);
    }
    .course-header::after {
      position: absolute;
      top: -72px;
      right: -36px;
      width: 190px;
      height: 190px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.24);
      content: "";
      pointer-events: none;
    }
    .course-back {
      position: absolute;
      z-index: 1;
      top: calc(env(safe-area-inset-top, 0px) + 20px);
      left: clamp(20px, 5vw, 36px);
      display: grid;
      width: 48px;
      height: 48px;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      background: #FFFFFF;
      color: #171B2B;
      box-shadow: 0 8px 24px rgba(36, 48, 68, 0.08);
      cursor: pointer;
    }
    .course-back svg {
      width: 22px;
      height: 22px;
    }
    .course-title {
      position: relative;
      z-index: 1;
      margin: 0;
      padding: 0 56px;
      color: #171B2B;
      font-size: clamp(23px, 6vw, 28px);
      font-weight: 600;
      letter-spacing: -0.04em;
      line-height: 1.2;
      text-align: center;
    }
    .course-content {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px 44px;
    }
    .course-search {
      position: relative;
      z-index: 2;
      display: flex;
      width: min(100%, 640px);
      height: 62px;
      align-items: center;
      gap: 12px;
      margin: -24px auto 28px;
      padding: 0 10px 0 20px;
      border: 1px solid rgba(228, 229, 234, 0.85);
      border-radius: 28px;
      background: #FFFFFF;
      box-shadow: 0 10px 28px rgba(36, 48, 68, 0.08);
    }
    .course-search-icon {
      width: 22px;
      height: 22px;
      flex: 0 0 auto;
      color: #3767D8;
    }
    .course-search input {
      width: 100%;
      min-width: 0;
      height: 100%;
      padding: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: #171B2B;
      font-size: clamp(13px, 3.7vw, 16px);
    }
    .course-search input::placeholder {
      color: #A5A7AA;
      opacity: 1;
    }
    .course-search input::-webkit-search-cancel-button {
      display: none;
    }
    .course-clear {
      display: grid;
      width: 40px;
      height: 40px;
      flex: 0 0 40px;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: #626B7D;
      cursor: pointer;
    }
    .course-clear[hidden],
    .course-empty[hidden] {
      display: none;
    }
    .course-clear svg {
      width: 19px;
      height: 19px;
    }
    .course-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }
    .course-card {
      display: flex;
      min-width: 0;
      min-height: 184px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 20px 12px 18px;
      border: 1px solid #E8E1ED;
      border-radius: 30px;
      background: #FEFBF6;
      box-shadow: 0 8px 24px rgba(36, 48, 68, 0.04);
      color: #171B2B;
      cursor: pointer;
      text-align: center;
      transition: border-color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
    }
    .course-card[hidden] {
      display: none;
    }
    .course-card:nth-child(2) { border-color: #EDE1D6; }
    .course-card:nth-child(3) { border-color: #DDEBE9; }
    .course-card:nth-child(4) { border-color: #DDE7F2; }
    .course-card:nth-child(5) { border-color: #E8E1ED; }
    .course-card:active { transform: scale(0.98); }
    .course-card[aria-pressed="true"] {
      border-color: #3767D8;
      box-shadow: 0 8px 24px rgba(55, 103, 216, 0.14);
    }
    .course-art {
      display: grid;
      width: 88px;
      height: 88px;
      flex: 0 0 auto;
      place-items: center;
      border: 1px solid rgba(228, 229, 234, 0.7);
      border-radius: 50%;
      background: #F2F5FC;
    }
    .course-card:nth-child(2) .course-art { background: #FFF4E8; }
    .course-card:nth-child(3) .course-art { background: #ECF7F6; }
    .course-card:nth-child(4) .course-art { background: #EDF5FC; }
    .course-card:nth-child(5) .course-art { background: #F7F1FA; }
    .course-art svg {
      display: block;
      width: 62px;
      height: 62px;
      object-fit: contain;
    }
    .course-code {
      margin: 0;
      color: #171B2B;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.025em;
      line-height: 1.3;
    }
    .course-empty {
      margin: 28px 0 0;
      color: #626B7D;
      font-size: 15px;
      text-align: center;
    }
    #startLearningCard:focus-visible,
    .course-screen button:focus-visible,
    .course-screen input:focus-visible {
      outline: 3px solid rgba(55, 103, 216, 0.45);
      outline-offset: 3px;
    }
    .course-screen .course-search input:focus-visible {
      outline: none;
      outline-offset: 0;
    }
    @media (max-width: 380px) {
      .course-content { padding-right: 16px; padding-left: 16px; }
      .course-grid { gap: 12px; }
      .course-card { min-height: 172px; padding-right: 8px; padding-left: 8px; }
      .course-art { width: 80px; height: 80px; }
    }
    @media (min-width: 700px) {
      .course-header { min-height: 176px; }
      .course-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; }
      .course-card { min-height: 210px; }
    }
    @media (min-width: 1050px) {
      .course-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); }
    }
  </style>
</head>
<body class="bg-app-bg min-h-screen text-app-primary flex justify-center selection:bg-app-orange selection:text-white">

  <!-- Responsive Page Container -->
  <div id="homeScreen" class="screen w-full max-w-[430px] md:max-w-none min-h-screen flex flex-col relative pb-32 overflow-x-hidden">

    <!-- Top Hero Section -->
    <header class="hero-gradient relative rounded-b-hero shadow-hero px-6 pt-5 pb-8 md:px-10 md:pt-8 md:pb-12 lg:px-16 xl:px-20 overflow-hidden safe-top">
      <!-- Ambient background circles -->
      <div class="absolute -top-16 -right-12 w-48 h-48 rounded-full bg-white/25 pointer-events-none blur-[1px]"></div>
      <div class="absolute bottom-2 -left-10 w-36 h-36 rounded-full bg-white/30 pointer-events-none"></div>

      <!-- Top Bar: Logo & Utility Controls -->
      <div class="relative z-10 flex items-center justify-between mb-8">
        <!-- Logo Container -->
        <div class="w-14 h-14 rounded-full bg-white shadow-soft flex items-center justify-center p-2.5 transition-transform active:scale-95 cursor-pointer">
          <!-- Stylized Book & Cap / Learning emblem in Navy & Teal -->
          <svg viewBox="0 0 48 48" fill="none" class="w-full h-full" xmlns="http://www.w3.org/2000/svg">
            <rect width="48" height="48" rx="24" fill="white"/>
            <path d="M24 12L10 19L24 26L38 19L24 12Z" fill="#3767D8"/>
            <path d="M14 23.5V30.5C14 34.5 18.5 37.5 24 37.5C29.5 37.5 34 34.5 34 30.5V23.5L24 28.5L14 23.5Z" fill="#64C5CC"/>
            <circle cx="24" cy="20" r="3" fill="#F6A04A"/>
          </svg>
        </div>

        <!-- 3 Rounded-Square Utility Buttons -->
        <div class="flex items-center space-x-2.5">
          <!-- Notification / Bell Icon -->
          <button type="button" aria-label="Notifications" class="w-11 h-11 rounded-2xl bg-white/60 hover:bg-white/80 active:scale-90 backdrop-blur-md flex items-center justify-center text-app-primary border border-white/40 shadow-sm transition-all duration-150">
            <svg class="w-5 h-5 text-app-primary" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
          </button>

          <!-- Star / Favorites Icon -->
          <button type="button" aria-label="Favorites" class="w-11 h-11 rounded-2xl bg-white/60 hover:bg-white/80 active:scale-90 backdrop-blur-md flex items-center justify-center text-app-primary border border-white/40 shadow-sm transition-all duration-150">
            <svg class="w-5 h-5 text-app-primary" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
              <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
            </svg>
          </button>

          <!-- Share Icon -->
          <button type="button" aria-label="Share" class="w-11 h-11 rounded-2xl bg-white/60 hover:bg-white/80 active:scale-90 backdrop-blur-md flex items-center justify-center text-app-primary border border-white/40 shadow-sm transition-all duration-150">
            <svg class="w-5 h-5 text-app-primary" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
              <circle cx="18" cy="5" r="3"></circle>
              <circle cx="6" cy="12" r="3"></circle>
              <circle cx="18" cy="19" r="3"></circle>
              <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
              <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
            </svg>
          </button>
        </div>
      </div>

      <!-- Welcome Headings -->
      <div class="relative z-10 space-y-1.5 pb-2">
        <h1 class="text-3xl sm:text-[34px] md:text-5xl font-semibold text-app-primary tracking-tight leading-tight">
          Good Morning Student!
        </h1>
        <p class="text-[17px] font-normal text-app-secondary">
          What would you like to learn today?
        </p>
      </div>
    </header>

    <!-- Main Content Section -->
    <main class="px-5 pt-8 md:px-10 md:pt-10 lg:px-16 xl:px-20 flex-1">
      <!-- Section Heading -->
      <div class="mb-5 flex items-center justify-between">
        <h2 class="text-2xl md:text-3xl font-semibold text-app-primary tracking-tight">
          Explore Categories
        </h2>
      </div>

      <!-- Responsive grid with 4 pastel cards -->
      <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6">
        
        <!-- Card 1: Start Learning (card.blue #BDD3FC) -->
        <div id="startLearningCard" role="button" tabindex="0" aria-label="Start Learning" class="relative overflow-hidden rounded-card bg-card-blue p-4 flex flex-col justify-between shadow-card transition-all duration-200 active:scale-[0.98] cursor-pointer min-h-[220px]">
          <!-- Decorative circle in lower corner -->
          <div class="absolute -bottom-7 -right-7 w-28 h-28 rounded-full bg-card-blueDeco pointer-events-none"></div>

          <!-- Translucent Inset Panel with Illustration -->
          <div class="relative z-10 w-full h-32 rounded-2xl bg-white/45 backdrop-blur-xs flex items-center justify-center p-3 shadow-sm border border-white/30">
            <!-- Rocket / Book Start Learning Vector Illustration -->
            <svg viewBox="0 0 100 100" class="w-20 h-20 drop-shadow-sm" fill="none" xmlns="http://www.w3.org/2000/svg">
              <!-- Rocket Body -->
              <path d="M50 18C42 28 38 42 38 58L50 64L62 58C62 42 58 28 50 18Z" fill="#3767D8"/>
              <path d="M50 18C46 26 43 38 43 54L50 58V18Z" fill="#5F6FE0"/>
              <!-- Rocket Window -->
              <circle cx="50" cy="38" r="7" fill="white"/>
              <circle cx="50" cy="38" r="4.5" fill="#64C5CC"/>
              <!-- Fins -->
              <path d="M38 52L26 62C25 67 29 70 34 68L38 60V52Z" fill="#F6A04A"/>
              <path d="M62 52L74 62C75 67 71 70 66 68L62 60V52Z" fill="#F6A04A"/>
              <!-- Thrust Flame -->
              <path d="M45 64C45 74 50 82 50 82C50 82 55 74 55 64H45Z" fill="#FFD166"/>
              <path d="M47 64C47 70 50 75 50 75C50 75 53 70 53 64H47Z" fill="#FF5964"/>
              <!-- Stars -->
              <circle cx="28" cy="28" r="2.5" fill="#FFF"/>
              <circle cx="72" cy="34" r="2" fill="#FFF"/>
            </svg>
          </div>

          <!-- Title & Underline -->
          <div class="relative z-10 mt-3.5">
            <h3 class="text-lg font-semibold text-app-primary tracking-tight leading-snug">
              Start Learning
            </h3>
            <div class="w-9 h-1 rounded-full bg-card-blueAccent mt-1.5"></div>
          </div>
        </div>

        <!-- Card 2: TA Quiz (card.indigo #5F6FE0) -->
        <div class="relative overflow-hidden rounded-card bg-card-indigo p-4 flex flex-col justify-between shadow-card transition-all duration-200 active:scale-[0.98] cursor-pointer min-h-[220px]">
          <!-- Decorative circle in lower corner -->
          <div class="absolute -bottom-7 -right-7 w-28 h-28 rounded-full bg-card-indigoDeco pointer-events-none"></div>

          <!-- Translucent Inset Panel with Illustration -->
          <div class="relative z-10 w-full h-32 rounded-2xl bg-white/20 backdrop-blur-xs flex items-center justify-center p-3 shadow-sm border border-white/20">
            <!-- Quiz / Trophy / Lightbulb Vector Illustration -->
            <svg viewBox="0 0 100 100" class="w-20 h-20 drop-shadow-sm" fill="none" xmlns="http://www.w3.org/2000/svg">
              <!-- Trophy Cup -->
              <path d="M36 28H64V46C64 54 58 60 50 60C42 60 36 54 36 46V28Z" fill="#FFD166"/>
              <path d="M50 28H64V46C64 54 58 60 50 60V28Z" fill="#F6A04A"/>
              <!-- Trophy Handles -->
              <path d="M36 34H28C26 34 24 36 24 40C24 45 28 48 36 48V42C31 42 30 40 30 39C30 38 31 38 36 38V34Z" fill="#FFD166"/>
              <path d="M64 34H72C74 34 76 36 76 40C76 45 72 48 64 48V42C69 42 70 40 70 39C70 38 69 38 64 38V34Z" fill="#F6A04A"/>
              <!-- Base & Stem -->
              <path d="M46 60H54V68H46V60Z" fill="#F6A04A"/>
              <path d="M38 68H62V74H38V68Z" fill="#FFD166"/>
              <!-- Checkmark badge / Star inside -->
              <circle cx="50" cy="44" r="6" fill="#FFFFFF"/>
              <path d="M48 44L49.5 45.5L52.5 42" stroke="#5F6FE0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>

          <!-- Title & Underline (White text on indigo) -->
          <div class="relative z-10 mt-3.5">
            <h3 class="text-lg font-semibold text-white tracking-tight leading-snug">
              TA Quiz
            </h3>
            <div class="w-9 h-1 rounded-full bg-card-indigoAccent mt-1.5"></div>
          </div>
        </div>

        <!-- Card 3: Bookmarks (card.mint #C4EBF0) -->
        <div class="relative overflow-hidden rounded-card bg-card-mint p-4 flex flex-col justify-between shadow-card transition-all duration-200 active:scale-[0.98] cursor-pointer min-h-[220px]">
          <!-- Decorative circle in lower corner -->
          <div class="absolute -bottom-7 -right-7 w-28 h-28 rounded-full bg-card-mintDeco pointer-events-none"></div>

          <!-- Translucent Inset Panel with Illustration -->
          <div class="relative z-10 w-full h-32 rounded-2xl bg-white/45 backdrop-blur-xs flex items-center justify-center p-3 shadow-sm border border-white/30">
            <!-- Book with Bookmark Ribbon Vector Illustration -->
            <svg viewBox="0 0 100 100" class="w-20 h-20 drop-shadow-sm" fill="none" xmlns="http://www.w3.org/2000/svg">
              <!-- Open Book Cover -->
              <rect x="26" y="24" width="48" height="54" rx="6" fill="#3767D8"/>
              <!-- Inner White Pages -->
              <rect x="30" y="26" width="40" height="50" rx="4" fill="#FFFFFF"/>
              <!-- Page lines -->
              <line x1="36" y1="36" x2="64" y2="36" stroke="#E4E5EA" stroke-width="2.5" stroke-linecap="round"/>
              <line x1="36" y1="44" x2="58" y2="44" stroke="#E4E5EA" stroke-width="2.5" stroke-linecap="round"/>
              <line x1="36" y1="52" x2="62" y2="52" stroke="#E4E5EA" stroke-width="2.5" stroke-linecap="round"/>
              <!-- Hanging Ribbon Bookmark -->
              <path d="M52 22V52L59 46L66 52V22H52Z" fill="#F6A04A"/>
            </svg>
          </div>

          <!-- Title & Underline -->
          <div class="relative z-10 mt-3.5">
            <h3 class="text-lg font-semibold text-app-primary tracking-tight leading-snug">
              Bookmarks
            </h3>
            <div class="w-9 h-1 rounded-full bg-card-mintAccent mt-1.5"></div>
          </div>
        </div>

        <!-- Card 4: Recently Viewed (card.sky #CEE7FD) -->
        <div class="relative overflow-hidden rounded-card bg-card-sky p-4 flex flex-col justify-between shadow-card transition-all duration-200 active:scale-[0.98] cursor-pointer min-h-[220px]">
          <!-- Decorative circle in lower corner -->
          <div class="absolute -bottom-7 -right-7 w-28 h-28 rounded-full bg-card-skyDeco pointer-events-none"></div>

          <!-- Translucent Inset Panel with Illustration -->
          <div class="relative z-10 w-full h-32 rounded-2xl bg-white/45 backdrop-blur-xs flex items-center justify-center p-3 shadow-sm border border-white/30">
            <!-- Clock / History Eye Vector Illustration -->
            <svg viewBox="0 0 100 100" class="w-20 h-20 drop-shadow-sm" fill="none" xmlns="http://www.w3.org/2000/svg">
              <!-- Outer Clock Disc -->
              <circle cx="50" cy="50" r="28" fill="#FFFFFF"/>
              <circle cx="50" cy="50" r="24" fill="#3767D8"/>
              <circle cx="50" cy="50" r="20" fill="#FFFFFF"/>
              <!-- Clock Hands -->
              <path d="M50 36V50H60" stroke="#F6A04A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
              <!-- Center Pivot -->
              <circle cx="50" cy="50" r="3" fill="#3767D8"/>
              <!-- Rotating Arrow Arc / History Indicator -->
              <path d="M26 44C27 34 35 26 46 24" stroke="#64C5CC" stroke-width="3.5" stroke-linecap="round"/>
              <polygon points="48,20 48,28 54,24" fill="#64C5CC"/>
            </svg>
          </div>

          <!-- Title & Underline -->
          <div class="relative z-10 mt-3.5">
            <h3 class="text-lg font-semibold text-app-primary tracking-tight leading-snug">
              Recently Viewed
            </h3>
            <div class="w-9 h-1 rounded-full bg-card-skyAccent mt-1.5"></div>
          </div>
        </div>

      </div>
    </main>

    <!-- Floating Bottom Navigation -->
    <nav class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[calc(100%-40px)] max-w-[390px] md:w-[560px] md:max-w-[calc(100%-3rem)] z-50">
      <div class="bg-white/95 backdrop-blur-md rounded-pill shadow-floating p-1.5 flex items-center border border-app-border/70 safe-bottom">
        
        <!-- Tab 1: Home (Selected: Pale peach/orange capsule #FFE2C4 + orange text/icon #F6A04A) -->
        <button type="button" class="flex-1 py-2.5 px-3 rounded-full bg-app-orangeLight flex flex-col items-center justify-center text-app-orange transition-all duration-200">
          <svg class="w-5 h-5 mb-0.5" fill="currentColor" viewBox="0 0 24 24">
            <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
          </svg>
          <span class="text-xs font-semibold tracking-wide">Home</span>
        </button>

        <!-- Vertical Separator -->
        <div class="w-[1px] h-7 bg-app-border"></div>

        <!-- Tab 2: Community (Muted slate #626B7D) -->
        <button type="button" class="flex-1 py-2.5 px-3 rounded-full flex flex-col items-center justify-center text-app-secondary hover:text-app-primary transition-all duration-200">

  <script>
    const homeScreen = document.getElementById('homeScreen');
    const courseScreen = document.getElementById('courseScreen');
    const startLearningCard = document.getElementById('startLearningCard');
    const searchInput = document.getElementById('courseSearch');
    const clearSearchButton = document.getElementById('clearSearch');
    const courseCards = Array.from(document.querySelectorAll('.course-card'));
    const emptyState = document.getElementById('emptyState');

    function showScreen(showCourses) {
      homeScreen.hidden = showCourses;
      courseScreen.hidden = !showCourses;
      document.title = showCourses ? 'BT Courses' : 'Student Learning Portal - Home';
      window.scrollTo(0, 0);
      if (showCourses) searchInput.focus({ preventScroll: true });
    }

    function openCourses() {
      if (window.location.hash !== '#courses') window.history.pushState({ screen: 'courses' }, '', '#courses');
      showScreen(true);
    }

    function returnHome() {
      if (window.location.hash === '#courses') {
        window.history.back();
      } else {
        showScreen(false);
      }
    }

    function syncScreenWithLocation() {
      showScreen(window.location.hash === '#courses');
    }

    function filterCourses() {
      const query = searchInput.value.trim().toUpperCase();
      let visibleCount = 0;
      courseCards.forEach((card) => {
        const matches = card.dataset.courseCode.includes(query);
        card.hidden = !matches;
        if (matches) visibleCount += 1;
      });
      clearSearchButton.hidden = query.length === 0;
      emptyState.hidden = visibleCount !== 0;
    }

    startLearningCard.addEventListener('click', openCourses);
    startLearningCard.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        openCourses();
      }
    });
    document.getElementById('courseBack').addEventListener('click', returnHome);
    window.addEventListener('popstate', syncScreenWithLocation);
    window.addEventListener('hashchange', syncScreenWithLocation);
    document.getElementById('courseSearchForm').addEventListener('submit', (event) => event.preventDefault());
    searchInput.addEventListener('input', filterCourses);
    clearSearchButton.addEventListener('click', () => {
      searchInput.value = '';
      filterCourses();
      searchInput.focus();
    });
    courseCards.forEach((card) => {
      card.addEventListener('click', () => {
        courseCards.forEach((item) => item.setAttribute('aria-pressed', String(item === card)));
        courseScreen.dataset.selectedCourse = card.dataset.courseCode;
      });
    });
    if (window.location.hash === '#courses') showScreen(true);
  </script>
